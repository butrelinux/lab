name: Auto Retry Failed Jobs

on:
  workflow_run:
    workflows: ["bluebuild"]
    types:
      - completed

jobs:
  retry:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' && 
      github.event.workflow_run.run_attempt < 3
    
    permissions:
      actions: write

    steps:
      - name: Wait for Quay to stabilize
        run: |
          echo "Detected a matrix job failure. Waiting 90 seconds before retrying..."
          sleep 90

      - name: Rerun failed matrix jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Triggering rerun for failed jobs in run ID: $RUN_ID"
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
