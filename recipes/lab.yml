---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lab
description: This is where I will be testing new butrelinux features

base-image: quay.io/centos-bootc/centos-bootc
image-version: c10s
modules:
  - from-file: common/bootstrap.yml
  - from-file: common/dnf.yml

  - type: custom-kernel
    source: local
    kernel: cachyos-lto
    initramfs: true
    zfs: true
    nvidia: false

  - type: image-info
    source: local
    variant: lab  
  
  - from-file: common/end.yml
