---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: ml-nvidia
description: butrelinux ml with nvidia support

base-image: quay.io/centos-bootc/centos-bootc
image-version: c10s
modules:
  - from-file: common/common.yml
  - from-file: common/nvidia.yml

  - type: custom-kernel
    source: local
    kernel: ml
    initramfs: true
    nvidia: true

  - type: image-info
    source: local
    variant: ml-nvidia
  
  - from-file: common/end.yml
